name: Generate Weekly News Summary

on:
  # Schedule to run every Saturday at 08:00 UTC
  schedule:
    - cron: '0 8 * * SAT'
  # Allow manual triggering from the GitHub UI
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    # Set permissions for GITHUB_TOKEN to allow committing to the repo
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run script to generate weekly summary
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_REPO_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          python weekly_summary.py

      - name: Commit and push new files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Bot: Add weekly news summary for $(date +'%Y-%m-%d')"
          commit_options: '--amend'
          file_pattern: 'docs/**'
          repository: '.'
          push_options: '--force'
